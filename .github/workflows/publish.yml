name: Publish Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          fi
          if [[ "$package_version" == *-* ]]; then
            npm_tag=next
          else
            npm_tag=latest
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Test packed consumer
        run: npm run test:npm-install

      - name: Verify package identity
        id: package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --json > package-pack.json
          local_shasum=$(node -p "require('./package-pack.json')[0].shasum")
          version="${{ steps.release.outputs.version }}"
          if remote_shasum=$(npm view "flary@$version" dist.shasum --json 2>/dev/null); then
            remote_shasum="${remote_shasum//\"/}"
            if [[ "$local_shasum" != "$remote_shasum" ]]; then
              echo "Published flary@$version does not match this tag." >&2
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.package.outputs.publish == 'true'
        run: npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set npm distribution tag
        run: npm dist-tag add "flary@${{ steps.release.outputs.version }}" "${{ steps.release.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
