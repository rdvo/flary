name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to verify and release
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A manual dispatch names the exact tag to release. Without this
          # ref, actions/checkout uses the default branch and can publish a
          # different package than the version being verified below.
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          release_tag="${{ inputs.release_tag || github.ref_name }}"
          tag_version="${release_tag#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $release_tag does not match package version $package_version." >&2
            exit 1
          fi
          if [[ "$package_version" == *-* ]]; then
            npm_tag=next
          else
            npm_tag=latest
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify stable session engine
        run: node scripts/check-release.cjs
        env:
          FLARY_RELEASE_VERSION: ${{ steps.release.outputs.version }}

      - name: Test
        run: npm test

      - name: Test packed consumer
        run: npm run test:npm-install

      - name: Detect live provider test configuration
        id: live
        shell: bash
        run: |
          set -euo pipefail
          configured=true
          for name in \
            OPENAI_API_KEY \
            ANTHROPIC_API_KEY \
            FLARY_OPENAI_CACHE_TEST_MODEL \
            FLARY_ANTHROPIC_CACHE_TEST_MODEL \
            FLARY_E2E_BASE_URL \
            FLARY_E2E_TOKEN \
            FLARY_E2E_APP_ID \
            FLARY_E2E_ORGANIZATION_ID \
            FLARY_E2E_AGENT_ID \
            FLARY_E2E_THREAD_ID \
            FLARY_E2E_MODEL_JSON
          do
            if [[ -z "${!name:-}" ]]; then
              configured=false
            fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [[ "$configured" != "true" ]]; then
            version="${{ steps.release.outputs.version }}"
            if [[ "$version" != *-* ]]; then
              echo "Stable $version requires all live provider recovery settings." >&2
              exit 1
            fi
            echo "::notice::Live provider recovery tests are not configured for this release candidate."
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLARY_OPENAI_CACHE_TEST_MODEL: ${{ secrets.FLARY_OPENAI_CACHE_TEST_MODEL }}
          FLARY_ANTHROPIC_CACHE_TEST_MODEL: ${{ secrets.FLARY_ANTHROPIC_CACHE_TEST_MODEL }}
          FLARY_E2E_BASE_URL: ${{ secrets.FLARY_E2E_BASE_URL }}
          FLARY_E2E_TOKEN: ${{ secrets.FLARY_E2E_TOKEN }}
          FLARY_E2E_APP_ID: ${{ secrets.FLARY_E2E_APP_ID }}
          FLARY_E2E_ORGANIZATION_ID: ${{ secrets.FLARY_E2E_ORGANIZATION_ID }}
          FLARY_E2E_AGENT_ID: ${{ secrets.FLARY_E2E_AGENT_ID }}
          FLARY_E2E_THREAD_ID: ${{ secrets.FLARY_E2E_THREAD_ID }}
          FLARY_E2E_MODEL_JSON: ${{ secrets.FLARY_E2E_MODEL_JSON }}

      - name: Live provider recovery tests
        if: steps.live.outputs.configured == 'true'
        run: npm run test:live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLARY_OPENAI_CACHE_TEST_MODEL: ${{ secrets.FLARY_OPENAI_CACHE_TEST_MODEL }}
          FLARY_ANTHROPIC_CACHE_TEST_MODEL: ${{ secrets.FLARY_ANTHROPIC_CACHE_TEST_MODEL }}
          FLARY_E2E_BASE_URL: ${{ secrets.FLARY_E2E_BASE_URL }}
          FLARY_E2E_TOKEN: ${{ secrets.FLARY_E2E_TOKEN }}
          FLARY_E2E_APP_ID: ${{ secrets.FLARY_E2E_APP_ID }}
          FLARY_E2E_ORGANIZATION_ID: ${{ secrets.FLARY_E2E_ORGANIZATION_ID }}
          FLARY_E2E_AGENT_ID: ${{ secrets.FLARY_E2E_AGENT_ID }}
          FLARY_E2E_THREAD_ID: ${{ secrets.FLARY_E2E_THREAD_ID }}
          FLARY_E2E_MODEL_JSON: ${{ secrets.FLARY_E2E_MODEL_JSON }}

      - name: Verify package identity
        id: package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --json > package-pack.json
          local_shasum=$(node -p "require('./package-pack.json')[0].shasum")
          version="${{ steps.release.outputs.version }}"
          if remote_shasum=$(npm view "flary@$version" dist.shasum --json 2>/dev/null); then
            remote_shasum="${remote_shasum//\"/}"
            if [[ "$local_shasum" != "$remote_shasum" ]]; then
              echo "Published flary@$version does not match this tag." >&2
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.package.outputs.publish == 'true'
        run: npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set npm distribution tag
        run: npm dist-tag add "flary@${{ steps.release.outputs.version }}" "${{ steps.release.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Release ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          make_latest: ${{ contains(inputs.release_tag || github.ref_name, '-') && 'false' || 'true' }}
